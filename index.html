<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pokQuiz</title>

    <link rel="stylesheet" href="a.css">
</head>

<body>
    <section id="startpage">
        <div class="box stpage">
            <span>PokQuiz yourself</span>


            <div id="strquiz">Start Quiz</div>

        </div>
    </section>

    <section id="diffpage">

        <div class="box diff">
            <span>Select Diffeculty</span>
            <ul>
                <li>Baby</li>
                <li>Easy</li>
                <li>Medium</li>
                <li>Hard</li>
                <li>Legend</li>
            </ul>
        </div>
    </section>

    <section id="quizpage">
        <div class="box quiz">

            <div class="number">
                <span class="que-no"></span>
                <span><span class="que-no"></span>/10</span>

            </div>

            <div id="question">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Sint, pariatur!</div>

            <form action="">
                <div id="option">

                    <label class="option" id="label1">
                        <input type="radio" name="option" id="option1" value="A">
                        <span id="text1">assd</span>
                    </label>

                    <label class="option" id="label2">
                        <input type="radio" name="option" id="option2" value="B">
                        <span id="text2">dd</span>
                    </label>

                    <label class="option" id="label3">
                        <input type="radio" name="option" id="option3" value="C">
                        <span id="text3">aav</span>
                    </label>

                    <label class="option" id="label4">
                        <input type="radio" name="option" id="option4" value="D">
                        <span id="text4">acd</span>
                    </label>

                </div>
                <br>

                <input id="next" type="submit" value="next">
            </form>
        </div>

    </section>

    <section id="resultpage">
        <div class="box">
            <div class="scorecard">
            <span class="final_score"><span></span>/100</span>

            <span></span>
            </div>


            <div class="back">Back to Home</div>
        </div>
    </section>

</body>

<script src="a.js"></script>

</html>
